# 두 앱의 버전을 올려 main에 푸시하면, 그 버전(v<버전>) 릴리스가 아직 없을 때만
# Windows 휴대용 ZIP과 Android APK를 만들어 GitHub 릴리스로 올린다.
# 두 앱은 이 저장소의 최신 릴리스를 확인해 새 버전 알림을 띄운다.
#
# 필요한 비밀값(Settings → Secrets and variables → Actions):
#   ANDROID_SIGNING_KEYSTORE_BASE64  지금 설치된 Android 앱을 서명한 키 저장소(base64).
#                                    android/scripts/copy-signing-key.ps1로 클립보드에 복사할 수 있다.
# 키가 다르면 기기에 덮어 설치할 수 없으므로, 서명 인증서가 android/signing-certificate.sha256과
# 다르면 배포하지 않는다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: 배포할 버전 확인
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          desktop=$(node -p "require('./desktop/package.json').version")
          android=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts)
          if [ "$desktop" != "$android" ]; then
            echo "::error::Windows(${desktop})와 Android(${android}) 버전이 다릅니다. scripts/bump-version.cjs로 함께 올리세요."
            exit 1
          fi
          echo "version=${desktop}" >> "$GITHUB_OUTPUT"
          if gh release view "v${desktop}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v${desktop} 릴리스가 이미 있어 이번에는 배포하지 않습니다."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "v${desktop}을 배포합니다."
          fi

  windows:
    name: Windows 휴대용 ZIP
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: 테스트와 휴대용 ZIP 만들기
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/Writing-Enhancer-${{ needs.plan.outputs.version }}-portable.zip
          if-no-files-found: error

  android:
    name: Android APK
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 비밀값이 없습니다. android/scripts/copy-signing-key.ps1로 복사해 등록한 뒤 이 작업을 다시 실행하세요."
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/signing.keystore"
          # 키를 쓰기 전에, 등록된 키가 설치된 앱의 키와 같은지 먼저 확인한다(지문은 공개 정보).
          keystore=$(keytool -list -v -keystore "${RUNNER_TEMP}/signing.keystore" -storepass android 2>&1 || true)
          found=$(printf '%s\n' "${keystore}" | sed -nE 's/^[[:space:]]*SHA256: ([0-9A-F:]+)$/\1/p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          owner=$(printf '%s\n' "${keystore}" | sed -nE 's/^(Owner|소유자): (.*)$/\2/p' | head -1)
          expected=$(tr -d '[:space:]' < android/signing-certificate.sha256)
          size=$(wc -c < "${RUNNER_TEMP}/signing.keystore")
          echo "등록된 키: ${size}바이트, 인증서 ${found:-읽지 못함} (${owner:-소유자 없음})"
          if [ "${found}" != "${expected}" ]; then
            echo "::error::등록된 서명 키(${size}바이트, 인증서 ${found:-읽지 못함}, ${owner:-소유자 없음})가 설치된 앱의 키(${expected})와 다릅니다. android/scripts/copy-signing-key.ps1로 다시 복사해 비밀값을 덮어쓰세요."
            exit 1
          fi

      - name: 테스트와 APK 만들기
        working-directory: android
        env:
          WE_SIGNING_STORE_FILE: ${{ runner.temp }}/signing.keystore
          # 지금 설치된 앱은 Android 기본 디버그 키로 서명돼 있어 그 키의 기본 암호를 쓴다.
          WE_SIGNING_STORE_PASSWORD: android
          WE_SIGNING_KEY_ALIAS: androiddebugkey
          WE_SIGNING_KEY_PASSWORD: android
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "WritingEnhancer-${{ needs.plan.outputs.version }}.apk"

      - name: 서명 인증서가 설치된 앱과 같은지 확인
        working-directory: android
        run: |
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner"
          actual=$("${apksigner}" verify --print-certs "WritingEnhancer-${{ needs.plan.outputs.version }}.apk" \
            | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9a-f]+)$/\1/p')
          expected=$(tr -d '[:space:]' < signing-certificate.sha256)
          echo "서명 인증서: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::APK 서명 인증서(${actual:-읽지 못함})가 설치된 앱(${expected})과 다릅니다. 이 APK로는 덮어 설치할 수 없어 배포하지 않습니다."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/WritingEnhancer-${{ needs.plan.outputs.version }}.apk
          if-no-files-found: error

  publish:
    name: 릴리스 올리기
    needs: [plan, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: 검사 값과 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd release
          sha256sum "Writing-Enhancer-${VERSION}-portable.zip" "WritingEnhancer-${VERSION}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          gh release create "v${VERSION}" \
            "release/Writing-Enhancer-${VERSION}-portable.zip" \
            "release/WritingEnhancer-${VERSION}.apk" \
            "release/SHA256SUMS.txt" \
            --target "${GITHUB_SHA}" \
            --title "글 강화기 ${VERSION}" \
            --generate-notes
