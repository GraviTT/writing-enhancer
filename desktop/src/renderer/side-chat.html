<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사이드 채팅 베타</title>
    <link rel="stylesheet" href="./side-chat.css" />
  </head>
  <body>
    <main class="chat-window">
      <header id="sideChatDragHandle" class="chat-header">
        <div class="chat-brand">
          <span class="chat-mark" aria-hidden="true">✦</span>
          <div>
            <div class="chat-title-row">
              <strong>사이드 채팅</strong>
              <span class="beta-badge">BETA</span>
            </div>
            <small>현재 글과 기능이 연결된 대화</small>
          </div>
        </div>
        <div class="header-actions">
          <button id="openWritingButton" class="text-icon-button no-drag" type="button" aria-label="글 강화기로 전환" title="글 강화기로 전환">글로</button>
          <button id="newChatButton" class="icon-button no-drag" type="button" aria-label="새 채팅" title="새 채팅">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66M4 5v5h5" /></svg>
          </button>
          <button id="minimizeChatButton" class="icon-button no-drag" type="button" aria-label="사이드 채팅 최소화" title="최소화">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17h12" /></svg>
          </button>
          <button id="closeChatButton" class="icon-button no-drag" type="button" aria-label="사이드 채팅 닫기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
          </button>
        </div>
      </header>

      <div id="writingContextBar" class="writing-context-bar" aria-live="polite">
        <span aria-hidden="true">↗</span>
        <span id="writingContextText">글 강화기 작업을 확인하는 중</span>
      </div>

      <section id="messageList" class="message-list" aria-live="polite">
        <div id="emptyChat" class="empty-chat">
          <span aria-hidden="true">✦</span>
          <strong>옆에서 바로 물어보세요.</strong>
          <p>질문, 아이디어 정리, 짧은 글쓰기까지 자유롭게 대화할 수 있어요.</p>
        </div>
      </section>

      <section class="composer">
        <div id="visualPreview" class="visual-preview is-hidden" aria-live="polite">
          <button id="visualPreviewOpenButton" class="visual-preview-image-button" type="button" aria-label="이미지 영역 선택">
            <img id="visualPreviewImage" alt="검색 전에 확인할 이미지 미리보기" />
          </button>
          <div class="visual-preview-meta">
            <strong id="visualPreviewTitle">이미지 준비됨</strong>
            <span>다음 질문에서 검색에 사용</span>
          </div>
          <button id="cropVisualButton" class="visual-preview-action" type="button">영역 선택</button>
          <button id="clearScreenContextButton" class="visual-preview-remove" type="button" aria-label="이미지 사용 취소">×</button>
        </div>
        <div class="composer-main">
          <button
            id="screenCaptureButton"
            class="composer-tool-button"
            type="button"
            aria-label="현재 화면을 다음 질문에 포함"
            title="현재 화면을 다음 질문에 포함"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9h8v6H8z" /></svg>
          </button>
          <button
            id="imagePickButton"
            class="composer-tool-button"
            type="button"
            aria-label="검색할 이미지 첨부"
            title="검색할 이미지 첨부"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM7 15l3-3 2 2 2-2 3 3M9 9h.01" /></svg>
          </button>
          <label class="sr-only" for="chatInput">사이드 채팅 메시지</label>
          <textarea
            id="chatInput"
            rows="2"
            maxlength="6000"
            placeholder="무엇이든 물어보세요."
          ></textarea>
          <button id="sendChatButton" type="button" aria-label="메시지 보내기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 14-7-4.5 14-3.2-5.1L5 12Z" /></svg>
          </button>
        </div>
      </section>
      <p class="separation-note">채팅 기록은 별도 저장 · 현재 글과 기능만 연동</p>

      <div id="clearConfirm" class="chat-confirm is-hidden" role="dialog" aria-modal="true" aria-labelledby="clearConfirmTitle">
        <div class="chat-confirm-card">
          <strong id="clearConfirmTitle">새 대화를 시작할까요?</strong>
          <p>현재 사이드 채팅 대화만 지워집니다.</p>
          <div class="chat-confirm-actions">
            <button id="clearCancelButton" type="button">취소</button>
            <button id="clearConfirmButton" class="danger" type="button">초기화</button>
          </div>
        </div>
      </div>

      <div id="chatToast" class="chat-toast is-hidden" role="alert">
        <span id="chatToastText"></span>
        <button id="chatToastAction" class="is-hidden" type="button">설정 열기</button>
      </div>
      <div id="cropDialog" class="crop-dialog is-hidden" role="dialog" aria-modal="true" aria-labelledby="cropDialogTitle">
        <div class="crop-card">
          <strong id="cropDialogTitle">검색할 영역 선택</strong>
          <p>필요한 부분을 드래그하세요. 선택한 영역을 검색 전에 다시 확인할 수 있어요.</p>
          <canvas id="cropCanvas" aria-label="이미지 영역 선택"></canvas>
          <div class="crop-actions">
            <button id="cropCancelButton" type="button">취소</button>
            <button id="cropFullButton" type="button">전체 사용</button>
            <button id="cropApplyButton" class="primary" type="button">선택 사용</button>
          </div>
        </div>
      </div>
      <div id="sideChatResizeHandle" class="resize-handle" aria-label="사이드 채팅 창 크기 조절">↘</div>
    </main>
    <script src="./visual-crop.js"></script>
    <script src="./side-chat.js"></script>
  </body>
</html>
